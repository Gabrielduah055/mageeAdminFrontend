<div class="flex h-screen bg-slate-50 overflow-hidden">

    <!-- ===== SIDEBAR ===== -->
    <aside [class]="isSidebarOpen ? 'w-64' : 'w-20'"
        class="bg-white border-r border-gray-100 flex flex-col fixed h-full z-20 transition-all duration-300 ease-in-out shadow-sm">

        <!-- Logo -->
        <div class="h-16 flex items-center px-5 border-b border-gray-100 flex-shrink-0">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
                style="background: linear-gradient(135deg, #be123c, #f43f5e);">
                <i class="uil uil-scissors text-lg text-white"></i>
            </div>
            <div *ngIf="isSidebarOpen" class="ml-3 overflow-hidden">
                <p class="font-bold text-gray-900 text-sm leading-tight whitespace-nowrap">Magee Salon</p>
                <p class="text-xs text-rose-500 font-medium">Admin Dashboard</p>
            </div>
        </div>

        <!-- Nav Links -->
        <nav class="flex-1 overflow-y-auto py-5 px-3 space-y-1">
            <ng-container *ngFor="let link of navLinks">
                <a [routerLink]="link.path" routerLinkActive="bg-rose-50 text-rose-600 border-r-4 border-rose-500"
                    class="flex items-center px-3 py-3 text-gray-500 rounded-xl hover:bg-rose-50 hover:text-rose-600 group transition-all cursor-pointer"
                    [class.justify-center]="!isSidebarOpen">
                    <i [class]="'uil ' + link.icon + ' text-xl flex-shrink-0'"></i>
                    <span *ngIf="isSidebarOpen" class="ml-3 text-sm font-medium whitespace-nowrap">{{ link.label
                        }}</span>
                </a>
            </ng-container>
        </nav>

        <!-- User / Logout footer -->
        <div class="p-3 border-t border-gray-100 flex-shrink-0">
            <button (click)="logout()"
                class="w-full flex items-center px-3 py-3 text-gray-500 rounded-xl hover:bg-red-50 hover:text-red-600 transition-all cursor-pointer"
                [class.justify-center]="!isSidebarOpen">
                <i class="uil uil-signout text-xl flex-shrink-0"></i>
                <span *ngIf="isSidebarOpen" class="ml-3 text-sm font-medium">Logout</span>
            </button>
        </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <div [class]="isSidebarOpen ? 'ml-64' : 'ml-20'"
        class="flex-1 flex flex-col transition-all duration-300 ease-in-out min-w-0">

        <!-- Top Header -->
        <header
            class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 sticky top-0 z-10 flex-shrink-0">

            <!-- Left: Toggle + Breadcrumb -->
            <div class="flex items-center gap-4">
                <button (click)="toggleSidebar()"
                    class="p-2 rounded-xl text-gray-400 hover:text-rose-600 hover:bg-rose-50 transition-all cursor-pointer">
                    <i [class]="isSidebarOpen ? 'uil uil-align-left text-xl' : 'uil uil-align-right text-xl'"></i>
                </button>

                <!-- Search bar -->
                <div
                    class="hidden md:flex items-center gap-2 bg-gray-50 border border-gray-100 rounded-xl px-4 py-2 w-64">
                    <i class="uil uil-search text-gray-400"></i>
                    <input type="text" placeholder="Search..."
                        class="bg-transparent text-sm outline-none text-gray-600 placeholder-gray-400 w-full" />
                </div>
            </div>

            <!-- Right: Notifications + Profile -->
            <div class="flex items-center gap-3">

                <!-- Notification bell -->
                <button
                    class="relative p-2 rounded-xl text-gray-400 hover:text-rose-600 hover:bg-rose-50 transition-all cursor-pointer">
                    <i class="uil uil-bell text-xl"></i>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white"></span>
                </button>

                <!-- Profile -->
                <div class="relative">
                    <button (click)="toggleProfileMenu()"
                        class="flex items-center gap-3 pl-3 pr-2 py-2 rounded-xl hover:bg-gray-50 transition-all cursor-pointer">
                        <div class="text-right hidden sm:block">
                            <p class="text-sm font-semibold text-gray-800 leading-tight">{{ getUser()?.name || 'Admin'
                                }}</p>
                            <p class="text-xs text-rose-500">Super Admin</p>
                        </div>
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white font-bold text-sm flex-shrink-0"
                            style="background: linear-gradient(135deg, #be123c, #f43f5e);">
                            {{ (getUser()?.name || 'A').charAt(0).toUpperCase() }}
                        </div>
                        <i class="uil uil-angle-down text-gray-400"></i>
                    </button>

                    <!-- Dropdown -->
                    <div *ngIf="isProfileMenuOpen"
                        class="absolute right-0 top-full mt-2 w-48 bg-white rounded-2xl shadow-lg border border-gray-100 py-2 z-50">
                        <a routerLink="/settings" (click)="isProfileMenuOpen=false"
                            class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-600 hover:bg-rose-50 hover:text-rose-600 cursor-pointer transition-all">
                            <i class="uil uil-setting text-base"></i> Settings
                        </a>
                        <hr class="my-1 border-gray-100">
                        <button (click)="logout()"
                            class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 cursor-pointer transition-all">
                            <i class="uil uil-signout text-base"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="flex-1 overflow-y-auto p-6">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
