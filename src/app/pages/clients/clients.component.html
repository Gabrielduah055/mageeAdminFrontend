<!-- Clients Page -->
<div class="space-y-6">

    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Clients</h1>
            <p class="text-sm text-gray-500 mt-0.5">Manage your salon clientele</p>
        </div>
        <button
            class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold text-white shadow-sm cursor-pointer"
            style="background: linear-gradient(135deg, #be123c, #f43f5e);">
            <i class="uil uil-user-plus"></i> Add Client
        </button>
    </div>

    <!-- Search Bar -->
    <div class="flex items-center gap-3 bg-white border border-gray-100 rounded-2xl px-4 py-3 shadow-sm max-w-md">
        <i class="uil uil-search text-gray-400 text-lg"></i>
        <input type="text" (input)="onSearch($event)" placeholder="Search by name or phone..."
            class="bg-transparent text-sm outline-none text-gray-600 placeholder-gray-400 flex-1" />
    </div>

    <!-- Clients Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
        <div *ngFor="let client of filteredClients"
            class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 hover:shadow-md hover:-translate-y-0.5 transition-all">
            <div class="flex items-start justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div
                        class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-lg font-bold flex-shrink-0">
                        {{ client.name.charAt(0) }}
                    </div>
                    <div>
                        <p class="font-bold text-gray-900">{{ client.name }}</p>
                        <p class="text-xs text-gray-400">{{ client.phone }}</p>
                    </div>
                </div>
                <span [class]="'px-2.5 py-1 rounded-full text-xs font-semibold ' + getStatusClass(client.status)">
                    {{ client.status }}
                </span>
            </div>

            <div class="grid grid-cols-3 gap-2 pt-4 border-t border-gray-50">
                <div class="text-center">
                    <p class="text-lg font-bold text-gray-900">{{ client.visits }}</p>
                    <p class="text-xs text-gray-400">Visits</p>
                </div>
                <div class="text-center border-x border-gray-50">
                    <p class="text-sm font-bold text-gray-900">{{ client.totalSpent }}</p>
                    <p class="text-xs text-gray-400">Spent</p>
                </div>
                <div class="text-center">
                    <p class="text-xs font-semibold text-gray-600">{{ client.lastVisit }}</p>
                    <p class="text-xs text-gray-400">Last Visit</p>
                </div>
            </div>

            <div class="flex gap-2 mt-4">
                <button
                    class="flex-1 flex items-center justify-center gap-1 py-2 rounded-xl text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 cursor-pointer transition-all">
                    <i class="uil uil-calendar-alt"></i> Book
                </button>
                <button
                    class="flex-1 flex items-center justify-center gap-1 py-2 rounded-xl text-xs font-semibold text-gray-500 bg-gray-50 hover:bg-gray-100 cursor-pointer transition-all">
                    <i class="uil uil-phone"></i> Call
                </button>
            </div>
        </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="filteredClients.length === 0" class="text-center py-16 text-gray-400">
        <i class="uil uil-user-times text-5xl mb-3 block"></i>
        <p class="font-semibold">No clients found</p>
        <p class="text-sm mt-1">Try a different search term</p>
    </div>
</div>
