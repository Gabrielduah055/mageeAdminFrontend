<!-- Settings Page -->
<div class="space-y-6 max-w-2xl">
    <!-- Header -->
    <div>
        <h1 class="text-2xl font-bold text-gray-900">Settings</h1>
        <p class="text-sm text-gray-500 mt-0.5">Manage your salon profile and preferences</p>
    </div>

    <!-- Success Message -->
    <div *ngIf="savedMessage"
        class="flex items-center gap-3 bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-xl text-sm">
        <i class="uil uil-check-circle text-lg"></i>
        {{ savedMessage }}
    </div>

    <!-- Tabs -->
    <div class="flex gap-1 bg-gray-100 p-1 rounded-xl w-fit">
        <button (click)="setTab('profile')"
            [class]="activeTab === 'profile' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'"
            class="px-4 py-2 rounded-lg text-sm font-medium transition-all cursor-pointer">
            Profile
        </button>
        <button (click)="setTab('hours')"
            [class]="activeTab === 'hours' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'"
            class="px-4 py-2 rounded-lg text-sm font-medium transition-all cursor-pointer">
            Business Hours
        </button>
    </div>

    <!-- Form Card -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
        <form [formGroup]="profileForm" (ngSubmit)="save()">

            <!-- Profile Tab -->
            <div *ngIf="activeTab === 'profile'" class="space-y-5">
                <!-- Avatar -->
                <div class="flex items-center gap-5 pb-5 border-b border-gray-50">
                    <div
                        class="w-20 h-20 rounded-2xl text-rose-700 bg-rose-100 flex items-center justify-center text-3xl font-bold">
                        M</div>
                    <div>
                        <p class="font-semibold text-gray-800">Salon Logo</p>
                        <p class="text-xs text-gray-400 mt-0.5">JPG, PNG up to 2MB</p>
                        <button type="button"
                            class="mt-2 text-xs font-semibold text-rose-600 hover:text-rose-700 cursor-pointer">Upload
                            Photo</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Salon Name</label>
                        <input formControlName="salonName" type="text"
                            class="w-full px-4 py-3 border-2 border-gray-100 rounded-xl text-sm bg-gray-50 focus:bg-white focus:border-rose-400 focus:outline-none focus:ring-4 focus:ring-rose-50 transition-all" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Owner Name</label>
                        <input formControlName="ownerName" type="text"
                            class="w-full px-4 py-3 border-2 border-gray-100 rounded-xl text-sm bg-gray-50 focus:bg-white focus:border-rose-400 focus:outline-none focus:ring-4 focus:ring-rose-50 transition-all" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
                        <input formControlName="email" type="email"
                            class="w-full px-4 py-3 border-2 border-gray-100 rounded-xl text-sm bg-gray-50 focus:bg-white focus:border-rose-400 focus:outline-none focus:ring-4 focus:ring-rose-50 transition-all" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Phone</label>
                        <input formControlName="phone" type="text"
                            class="w-full px-4 py-3 border-2 border-gray-100 rounded-xl text-sm bg-gray-50 focus:bg-white focus:border-rose-400 focus:outline-none focus:ring-4 focus:ring-rose-50 transition-all" />
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Address</label>
                        <input formControlName="address" type="text"
                            class="w-full px-4 py-3 border-2 border-gray-100 rounded-xl text-sm bg-gray-50 focus:bg-white focus:border-rose-400 focus:outline-none focus:ring-4 focus:ring-rose-50 transition-all" />
                    </div>
                </div>
            </div>

            <!-- Hours Tab -->
            <div *ngIf="activeTab === 'hours'" class="space-y-4">
                <p class="text-sm text-gray-500">Set your salon's operating hours below.</p>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Opening Time</label>
                        <input formControlName="openTime" type="time"
                            class="w-full px-4 py-3 border-2 border-gray-100 rounded-xl text-sm bg-gray-50 focus:bg-white focus:border-rose-400 focus:outline-none focus:ring-4 focus:ring-rose-50 transition-all" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Closing Time</label>
                        <input formControlName="closeTime" type="time"
                            class="w-full px-4 py-3 border-2 border-gray-100 rounded-xl text-sm bg-gray-50 focus:bg-white focus:border-rose-400 focus:outline-none focus:ring-4 focus:ring-rose-50 transition-all" />
                    </div>
                </div>
            </div>

            <!-- Save Button -->
            <div class="flex justify-end mt-6 pt-5 border-t border-gray-50">
                <button type="submit"
                    class="flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-semibold text-white cursor-pointer shadow-sm"
                    style="background: linear-gradient(135deg, #be123c, #f43f5e);">
                    <i class="uil uil-check"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
