<!-- Services Page -->
<div class="space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Services</h1>
            <p class="text-sm text-gray-500 mt-0.5">Manage your salon service catalog</p>
        </div>
        <button
            class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold text-white shadow-sm cursor-pointer"
            style="background: linear-gradient(135deg, #be123c, #f43f5e);">
            <i class="uil uil-plus"></i> Add Service
        </button>
    </div>

    <!-- Category Tabs -->
    <div class="flex gap-2 flex-wrap">
        <button *ngFor="let cat of categories" (click)="setCategory(cat)" [class]="activeCategory === cat
              ? 'bg-rose-600 text-white shadow-sm'
              : 'bg-white text-gray-500 border border-gray-100 hover:border-rose-200 hover:text-rose-600'"
            class="px-4 py-2 rounded-xl text-sm font-medium transition-all cursor-pointer">
            {{ cat }}
        </button>
    </div>

    <!-- Services Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
        <div *ngFor="let svc of filteredServices"
            class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 hover:shadow-md hover:-translate-y-0.5 transition-all relative overflow-hidden">

            <!-- Popular badge -->
            <div *ngIf="svc.popular"
                class="absolute top-0 right-0 bg-amber-400 text-white text-xs font-bold px-3 py-1 rounded-bl-xl">
                Popular
            </div>

            <!-- Icon -->
            <div class="w-12 h-12 rounded-2xl bg-rose-50 flex items-center justify-center mb-4">
                <i [class]="'uil ' + svc.icon + ' text-2xl text-rose-500'"></i>
            </div>

            <h3 class="font-bold text-gray-900 mb-1">{{ svc.name }}</h3>
            <span class="inline-block bg-gray-100 text-gray-500 text-xs px-2.5 py-1 rounded-full mb-4">{{ svc.category
                }}</span>

            <div class="flex items-center justify-between pt-4 border-t border-gray-50">
                <div class="flex items-center gap-1.5 text-gray-500 text-sm">
                    <i class="uil uil-clock text-base"></i>
                    {{ svc.duration }}
                </div>
                <div class="font-bold text-rose-600">{{ svc.price }}</div>
            </div>

            <div class="flex gap-2 mt-4">
                <button
                    class="flex-1 py-2 rounded-xl text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 cursor-pointer transition-all">Edit</button>
                <button
                    class="flex-1 py-2 rounded-xl text-xs font-semibold text-gray-400 bg-gray-50 hover:bg-gray-100 cursor-pointer transition-all">Remove</button>
            </div>
        </div>
    </div>
</div>
